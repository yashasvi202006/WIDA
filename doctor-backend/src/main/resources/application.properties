# ========================================================
# MEDiTRACK / WIDA - DOCTOR MODULE CONFIGURATION
# Module Owner: Vanshika Tailor
# ========================================================

server.port=8081
server.servlet.context-path=/api

spring.application.name=meditrack-doctor-module

# --------------------------------------------------------
# MySQL Primary Database Configuration
# --------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/meditrack_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------------
# JPA / Hibernate Configuration
# --------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# --------------------------------------------------------
# SQL Script Initialization (Seed Data)
# --------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# --------------------------------------------------------
# File Upload Settings (Documents & Profile Photos)
# --------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

